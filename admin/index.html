<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin — Meus links</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />

    <!-- tema inicial: localStorage > preferência do sistema (evita flash) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t)
            t = matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>

    <!-- fontes: Young Serif (serif display) + Hanken Grotesk (sans corpo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- estilos: tokens -> base -> layout -> components -->
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <a class="skip-link" href="#main">Pular para o conteúdo</a>

    <main class="container" id="main">
      <!-- perfil -->
      <header class="profile">
        <div class="profile__top">
          <div class="avatar avatar--photo">
            <img
              src="../assets/foto.jpg"
              alt="Foto de Nikolas Leme Santos"
              width="64"
              height="64"
              decoding="async"
            />
          </div>
          <button
            class="icon-btn theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Alternar tema claro/escuro"
          >
            <svg
              class="ic-sun"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            <svg
              class="ic-moon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg>
          </button>
        </div>

        <h1 class="profile__name">Painel</h1>
        <p class="profile__handle">administração dos links</p>
        <p class="profile__bio">
          <a class="text-link" href="../index.html">↗ ver página pública</a>
        </p>
      </header>

      <!-- lista de links -->
      <section aria-label="Meus links">
        <p class="section-title">Links</p>
        <ul class="cards" id="cards"></ul>
        <p class="empty" id="empty" hidden>
          Nenhum link ainda. Adicione o primeiro abaixo.
        </p>
      </section>

      <!-- formulário adicionar / editar -->
      <section class="form-panel" aria-labelledby="form-title">
        <h2 class="form-panel__title" id="form-title">Adicionar link</h2>
        <form id="card-form" novalidate>
          <div class="field">
            <label class="check">
              <input type="checkbox" id="f-kind" name="kind" />
              <span>É uma pasta</span>
            </label>
            <span class="helper">Pastas agrupam links e não têm URL.</span>
          </div>

          <div class="field">
            <label for="f-title"
              >Título <span class="req" aria-hidden="true">*</span></label
            >
            <input
              class="input"
              id="f-title"
              name="title"
              type="text"
              autocomplete="off"
              required
              aria-describedby="e-title"
              placeholder="Ex.: GitHub"
            />
            <span
              class="error"
              id="e-title"
              role="alert"
              aria-live="polite"
            ></span>
          </div>

          <div class="field">
            <label for="f-subtitle"
              >Subtítulo <span class="opt">(opcional)</span></label
            >
            <input
              class="input"
              id="f-subtitle"
              name="subtitle"
              type="text"
              autocomplete="off"
              placeholder="Ex.: meus repositórios"
            />
          </div>

          <div class="field" id="field-url">
            <label for="f-url"
              >URL <span class="req" aria-hidden="true">*</span></label
            >
            <input
              class="input"
              id="f-url"
              name="url"
              type="url"
              inputmode="url"
              autocomplete="off"
              required
              aria-describedby="e-url url-help"
              placeholder="https://exemplo.com"
            />
            <span class="helper" id="url-help">https:// , mailto: ou tel:</span>
            <span
              class="error"
              id="e-url"
              role="alert"
              aria-live="polite"
            ></span>
          </div>

          <div class="field" id="field-parent">
            <label for="f-parent"
              >Pasta (pai) <span class="opt">(opcional)</span></label
            >
            <select class="input" id="f-parent" name="parent">
              <option value="">— nenhuma (topo) —</option>
            </select>
          </div>

          <div class="field">
            <label for="f-order"
              >Ordem
              <span class="opt">(opcional — vazio = automático)</span></label
            >
            <input
              class="input"
              id="f-order"
              name="order"
              type="number"
              inputmode="numeric"
              min="1"
              step="1"
              aria-describedby="e-order"
              placeholder="1"
            />
            <span
              class="error"
              id="e-order"
              role="alert"
              aria-live="polite"
            ></span>
          </div>

          <div class="form-actions">
            <button class="btn btn--ghost" id="cancel-btn" type="button" hidden>
              Cancelar
            </button>
            <button class="btn btn--primary" id="submit-btn" type="submit">
              Adicionar
            </button>
          </div>
        </form>
      </section>

      <!-- publicação: grava js/mock.js no repo via API do GitHub (token só do dono) -->
      <section
        class="form-panel publish-panel"
        id="publish-panel"
        aria-labelledby="pub-title"
      >
        <h2 class="form-panel__title" id="pub-title">Publicação</h2>

        <p class="pub-status" id="pub-status">
          <span class="pub-dot" aria-hidden="true"></span>
          <span id="pub-status-text">Tudo publicado.</span>
        </p>

        <div class="field" id="field-token">
          <label for="f-token">Token</label>
          <input
            class="input"
            id="f-token"
            name="token"
            type="password"
            autocomplete="off"
            placeholder="* * * * * * * *"
          />
        </div>
        <p class="helper pub-token-saved" id="token-saved" hidden>
          Token salvo.
          <button class="text-link" id="token-change" type="button">
            Trocar
          </button>
        </p>

        <span class="error" id="e-pub" role="alert" aria-live="polite"></span>

        <div class="form-actions">
          <button class="btn btn--ghost" id="discard-btn" type="button">
            Descartar rascunho
          </button>
          <button class="btn btn--primary" id="publish-btn" type="button">
            Publicar
          </button>
        </div>
      </section>
    </main>

    <!-- modal QR -->
    <dialog class="qr-modal" id="qr-modal" aria-labelledby="qr-title">
      <div class="qr-modal__head">
        <h2 class="qr-modal__title" id="qr-title">QR code</h2>
        <button
          class="icon-btn"
          id="qr-close"
          type="button"
          aria-label="Fechar"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="qr-plate"><div id="qr-canvas"></div></div>
      <p class="qr-modal__url" id="qr-url"></p>
      <div class="qr-modal__actions">
        <!-- fechar já tem 3 saídas (X, backdrop, Esc); o ghost vira "copiar" -->
        <button class="btn btn--ghost" id="qr-copy" type="button">
          Copiar link
        </button>
        <button class="btn btn--primary" id="qr-download" type="button">
          Baixar PNG
        </button>
      </div>
    </dialog>

    <!-- scripts: vendor -> mock -> store -> qr -> ui -> admin -> publish -> app
       (admin.js e publish.js precisam vir ANTES do seed em app.js) -->
    <script src="../vendor/qr-code-styling.js"></script>
    <script src="../js/mock.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/qr.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/publish.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
