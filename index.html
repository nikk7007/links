<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nikolas Leme Santos · Desenvolvedor Web · Links</title>
  <meta name="description" content="Desenvolvedor web em Limeira (SP). Todos os meus links — LinkedIn, GitHub, Instagram e projetos — em um só lugar." />
  <meta name="author" content="Nikolas Leme Santos" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="canonical" href="https://nikolasleme.com.br/" />

  <!-- preview ao compartilhar (WhatsApp/redes). URLs absolutas no domínio de produção. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Nikolas Leme Santos" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:title" content="Nikolas Leme Santos · Desenvolvedor Web · Links" />
  <meta property="og:description" content="Todos os meus links — LinkedIn, GitHub, Instagram e projetos — em um só lugar." />
  <meta property="og:url" content="https://nikolasleme.com.br/" />
  <meta property="og:image" content="https://nikolasleme.com.br/assets/foto.jpg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Nikolas Leme Santos · Desenvolvedor Web · Links" />
  <meta name="twitter:description" content="Todos os meus links — LinkedIn, GitHub, Instagram e projetos — em um só lugar." />
  <meta name="twitter:image" content="https://nikolasleme.com.br/assets/foto.jpg" />

  <!-- tema inicial: localStorage > preferência do sistema (evita flash) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  <!-- fontes: Young Serif (serif display) + Hanken Grotesk (sans corpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- estilos: tokens -> base -> layout -> components -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />

  <!-- fundo 3D ambiente (Three.js vendorizado — funciona offline, como o QR) -->
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>

  <!-- dados estruturados: identidade (Person) para Google/AI. sameAs = perfis
       canônicos; manter em sincronia com os links de "Redes sociais". -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "url": "https://nikolasleme.com.br/",
    "mainEntity": {
      "@type": "Person",
      "name": "Nikolas Leme Santos",
      "alternateName": "@nik.nls",
      "jobTitle": "Desenvolvedor Web",
      "description": "Faço produtos para a web e cuido dos detalhes que ninguém vê.",
      "url": "https://nikolasleme.com.br/",
      "image": "https://nikolasleme.com.br/assets/foto.jpg",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Limeira",
        "addressRegion": "SP",
        "addressCountry": "BR"
      },
      "sameAs": [
        "https://www.linkedin.com/in/nikolas-santos-184657398",
        "https://github.com/nikk7007",
        "https://www.instagram.com/nik.nls/"
      ]
    }
  }
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <a class="skip-link" href="#main">Pular para o conteúdo</a>

  <main class="container" id="main">
    <!-- perfil -->
    <header class="profile">
      <div class="profile__top">
        <div class="avatar avatar--photo">
          <img src="assets/foto.jpg" alt="Foto de Nikolas Leme Santos" width="64" height="64" fetchpriority="high" decoding="async" />
        </div>
        <div class="profile__top-actions">
          <button class="icon-btn" id="share-page" type="button" aria-label="Compartilhar esta página">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.83 3.98"/></svg>
          </button>
          <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Alternar tema claro/escuro">
            <svg class="ic-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="ic-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
        </div>
      </div>

      <h1 class="profile__name">Nikolas Leme Santos</h1>
      <p class="profile__handle">@nik.nls · Dev · Limeira</p>
      <p class="profile__bio">Faço produtos para a web e cuido dos detalhes que ninguém vê.</p>
      <p class="profile__status"><span class="profile__dot" aria-hidden="true"></span>disponível para projetos</p>
    </header>

    <!-- lista de links (read-only). #cards é populado por JS (api/links.php).
         O <noscript> abaixo é o fallback rastreável por buscadores/IA que não
         executam JS — manter os perfis principais em sincronia com o banco. -->
    <section aria-label="Meus links">
      <ul class="cards" id="cards"></ul>
      <p class="empty" id="empty" hidden>Nenhum link por aqui ainda.</p>
      <noscript>
        <ul class="cards">
          <li><a href="https://www.linkedin.com/in/nikolas-santos-184657398" rel="me noopener">LinkedIn — experiência e network</a></li>
          <li><a href="https://github.com/nikk7007" rel="me noopener">GitHub — meus repositórios e projetos</a></li>
          <li><a href="https://www.instagram.com/nik.nls/" rel="me noopener">Instagram — @nik.nls</a></li>
          <li><a href="https://spin.nikolasleme.com.br" rel="noopener">Spin — veja sua sorte</a></li>
          <li><a href="mailto:nik700789@gmail.com">Email — fale comigo</a></li>
        </ul>
      </noscript>
    </section>
  </main>

  <!-- modal QR (compartilhar link) -->
  <dialog class="qr-modal" id="qr-modal" aria-labelledby="qr-title">
    <div class="qr-modal__head">
      <h2 class="qr-modal__title" id="qr-title">QR code</h2>
      <button class="icon-btn" id="qr-close" type="button" aria-label="Fechar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="qr-plate"><div id="qr-canvas"></div></div>
    <p class="qr-modal__url" id="qr-url"></p>
    <div class="qr-modal__actions">
      <!-- fechar já tem 3 saídas (X, backdrop, Esc); o ghost vira "copiar" -->
      <button class="btn btn--ghost" id="qr-copy" type="button">Copiar link</button>
      <button class="btn btn--primary" id="qr-download" type="button">Baixar PNG</button>
    </div>
  </dialog>

  <!-- scripts: vendor -> store -> qr -> ui -> app -->
  <script src="vendor/qr-code-styling.js"></script>
  <script src="js/store.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

  <!-- fundo 3D (módulo independente; falha silenciosa se WebGL indisponível) -->
  <script type="module" src="js/bg3d.js"></script>
</body>
</html>
